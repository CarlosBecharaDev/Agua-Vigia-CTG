name: Sala de control

# Regenera y publica el dashboard del proyecto en CADA push a develop —
# es decir, en cada PR que se fusiona — y se puede disparar a mano desde
# Actions. Sin filtro de rutas a proposito: los conteos de PRs, issues y
# el grafico de caudal salen de `gh pr list`/`gh issue list` en vivo, no
# solo de los archivos markdown, asi que cualquier fusion los cambia aunque
# no toque docs/. El generador (scripts/generar-dashboard.mjs) no inventa
# datos: lee PRs/issues reales con `gh` y parsea los registros en docs/.
#
# Ademas corre cada hora (schedule): "PRs abiertos" cuenta PRs SIN fusionar,
# asi que a diferencia del resto de los datos (que solo cambian al fusionar)
# puede quedar desactualizado mientras alguien abre un PR y nadie fusiona
# nada todavia. El repo es publico, los minutos de Actions no tienen limite.

on:
  push:
    branches: [develop]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generar la sala de control
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generar-dashboard.mjs

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-dashboard

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
