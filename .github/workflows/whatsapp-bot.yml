name: Resumen diario por WhatsApp

# Manda un resumen del proyecto (bugs graves, bloqueos, PRs sin revisar,
# avance) al grupo de WhatsApp del equipo, una vez al dia. No mantiene una
# conexion permanente: cada corrida restaura la sesion ya vinculada (cache
# de Actions), manda un mensaje y se desconecta -- por eso corre como job
# programado en vez de necesitar un servidor siempre encendido. La
# vinculacion inicial es manual, una sola vez, con whatsapp-vincular.yml.
# Detalle y riesgos aceptados: bot-whatsapp/README.md, ADR en
# design-decisions.md.

on:
  schedule:
    - cron: "0 13 * * *"   # 8:00 a.m. Cartagena (UTC-5)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del bot
        working-directory: bot-whatsapp
        run: npm install

      - name: Restaurar la sesion vinculada
        uses: actions/cache/restore@v4
        with:
          path: bot-whatsapp/sesion
          key: whatsapp-sesion-nunca-coincide
          restore-keys: whatsapp-sesion-

      - name: Enviar el resumen
        working-directory: bot-whatsapp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHATSAPP_GROUP_JID: ${{ secrets.WHATSAPP_GROUP_JID }}
        run: node enviar.mjs

      - name: Guardar la sesion actualizada
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot-whatsapp/sesion
          key: whatsapp-sesion-${{ github.run_id }}
