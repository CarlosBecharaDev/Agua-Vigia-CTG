name: Vincular el bot de WhatsApp

# Disparo MANUAL, una sola vez (o cuando haga falta re-vincular tras un
# bloqueo). Pide el numero dedicado, genera un codigo de emparejamiento en
# el log en vivo -- alguien tiene que escribirlo en el telefono dentro de
# ~60 segundos -- y de paso imprime los grupos a los que pertenece el
# numero, para sacar el JID que va en el secreto WHATSAPP_GROUP_JID.
# Detalle completo: bot-whatsapp/README.md y el ADR en design-decisions.md.

on:
  workflow_dispatch:
    inputs:
      numero:
        description: "Numero dedicado, con codigo de pais (ej. +573001234567). Vacio si ya esta vinculado y solo quieres re-listar los grupos."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  vincular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del bot
        working-directory: bot-whatsapp
        run: npm install

      - name: Restaurar sesion existente (si la hay)
        uses: actions/cache/restore@v4
        with:
          path: bot-whatsapp/sesion
          key: whatsapp-sesion-nunca-coincide
          restore-keys: whatsapp-sesion-

      - name: Vincular
        working-directory: bot-whatsapp
        run: node vincular.mjs "${{ inputs.numero }}"

      - name: Guardar la sesion
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot-whatsapp/sesion
          key: whatsapp-sesion-${{ github.run_id }}
