name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  build:
    name: Compilar, ArchUnit y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ArchUnit corre como parte de `./mvnw verify` (ver docs/D2, Regla de Oro de la arquitectura):
      # si domain/ importa Spring o MongoDB, este paso falla la build.
      - name: Build y pruebas (incluye ArchUnit)
        run: ./mvnw --batch-mode verify

      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14
