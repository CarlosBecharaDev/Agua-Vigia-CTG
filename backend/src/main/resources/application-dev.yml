# Backend corriendo nativo (./mvnw spring-boot:run) contra Mongo/Redis/Mailhog
# expuestos por docker-compose en localhost. Perfil por defecto.
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aguavigia}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

aguavigia:
  cors:
    # Solo en dev. El camino normal es el proxy /api del dev server de Vite (vite.config.ts),
    # que deja todo en el mismo origen y no necesita CORS; esto cubre al que prefiera apuntar
    # VITE_API_BASE_URL directo a http://localhost:8080/api. En docker y prod la lista queda
    # vacia porque nginx hace de proxy — ver CorsProperties.
    origenes-permitidos:
      - http://localhost:5173
      - http://127.0.0.1:5173

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.aguavigia.ctg: DEBUG
