# Sin defaults a proposito: si falta una variable de entorno en produccion,
# el arranque debe fallar ruidosamente, no conectar en silencio a localhost.
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}

aguavigia:
  mantenimiento:
    retencion-evidencia:
      # ADR-027 — minimizacion de datos. El default global es `false` para no sorprender a quien
      # levante el proyecto en local, pero un despliegue publico si tiene que decidir cuanto
      # conserva la evidencia fotografica de los vecinos: aqui se decide, y son 365 dias.
      # Solo se borra el binario; el reporte (sector, tipo, timestamp) se conserva porque sustenta
      # RF024 y el Indice de Cumplimiento.
      habilitada: true
      dias-retencion: 365

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.aguavigia.ctg: INFO
