server {
    listen 80;
    server_name _;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript application/json application/geo+json image/svg+xml text/css text/plain;
    root /usr/share/nginx/html;
    index index.html;

    # SSE (mapa en vivo, RF001-RF004): conexión larga y sin buffer — con el proxy_read_timeout
    # corto y el buffering de abajo, nginx cortaba el stream a los pocos segundos y el
    # EventSource del navegador reintentaba en bucle (ERR_INCOMPLETE_CHUNKED_ENCODING).
    location = /api/sectores/stream {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # SPA con react-router (BrowserRouter): toda ruta que no sea un archivo
    # existente cae a index.html para que el router del cliente la resuelva.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # El service worker de la PWA no debe cachearse: si se cachea, los
    # clientes quedan atados a una versión vieja del app shell.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|webp|geojson)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
