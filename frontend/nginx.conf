server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # SPA con react-router (BrowserRouter): toda ruta que no sea un archivo
    # existente cae a index.html para que el router del cliente la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker de la PWA no debe cachearse: si se cachea, los
    # clientes quedan atados a una versión vieja del app shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /barrios-cartagena.geojson {
        expires -1;
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/geo+json application/json;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
