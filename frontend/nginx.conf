server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE (mapa en vivo, RF001-RF004): conexión larga y sin buffer — con el proxy_read_timeout
    # corto y el buffering de abajo, nginx cortaba el stream a los pocos segundos y el
    # EventSource del navegador reintentaba en bucle (ERR_INCOMPLETE_CHUNKED_ENCODING).
    location = /api/sectores/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        add_header Cache-Control "no-store" always;
    }

    # La API va antes que el fallback del SPA: sin este bloque, /api/... caía en el
    # `try_files` de abajo y nginx devolvía el index.html con 200 en vez de llamar al
    # backend. Además application.yml (forward-headers-strategy: framework) da por hecho
    # que el X-Forwarded-For lo pone este proxy: si no llega, RateLimitingInterceptor
    # limita por la IP del contenedor de nginx, es decir un único contador global.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # Mismo proxy que `vite.config.ts` da en desarrollo. Sin esto, /acuacar-api caía en el
    # `location /` de abajo y devolvia el index.html del SPA con 200: el fetch de la Bitacora
    # recibia HTML donde esperaba JSON y la seccion quedaba vacia (mismo modo de fallo que BUG-053).
    # El User-Agent identifica al proyecto, nunca lo disfraza (CLAUDE.md, etica de datos, punto 3).
    location /acuacar-api/ {
        proxy_pass https://www.acuacar.com/wp-json/wp/v2/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.acuacar.com;
        proxy_set_header User-Agent "AguaVigiaCTG-Bot/1.0 (+rafasarmiento777@gmail.com)";
        proxy_set_header Accept "application/json";
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    # Mismo caso que /acuacar-api: `noticias.ts` pide /google-news-rss y solo `vite.config.ts`
    # lo proxeaba, asi que en Docker devolvia el index.html del SPA en vez del feed.
    location /google-news-rss/ {
        proxy_pass https://news.google.com/rss/;
        proxy_ssl_server_name on;
        proxy_set_header Host news.google.com;
        # Google redirige hl=es-CO a hl=es-419. Con el proxy_redirect por defecto el Location
        # salia como http://localhost/... porque nginx lo arma con $host, que descarta el puerto,
        # y el navegador no lo seguia. $http_host si conserva el :5173 del origen real.
        proxy_redirect ~^https?://news\.google\.com/rss(/.*)$ $scheme://$http_host/google-news-rss$1;
        proxy_set_header User-Agent "AguaVigiaCTG-Bot/1.0 (+rafasarmiento777@gmail.com)";
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    # SPA con react-router (BrowserRouter): toda ruta que no sea un archivo
    # existente cae a index.html para que el router del cliente la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker de la PWA no debe cachearse: si se cachea, los
    # clientes quedan atados a una versión vieja del app shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|geojson)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
