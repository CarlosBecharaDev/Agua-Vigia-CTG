server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API va antes que el fallback del SPA: sin este bloque, /api/... caía en el
    # `try_files` de abajo y nginx devolvía el index.html con 200 en vez de llamar al
    # backend. Además application.yml (forward-headers-strategy: framework) da por hecho
    # que el X-Forwarded-For lo pone este proxy: si no llega, RateLimitingInterceptor
    # limita por la IP del contenedor de nginx, es decir un único contador global.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/sectores/stream es un SSE que se queda abierto: con el buffer por defecto
        # nginx retiene los eventos hasta cerrar la conexión y el mapa nunca se entera.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # SPA con react-router (BrowserRouter): toda ruta que no sea un archivo
    # existente cae a index.html para que el router del cliente la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker de la PWA no debe cachearse: si se cachea, los
    # clientes quedan atados a una versión vieja del app shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|geojson)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
